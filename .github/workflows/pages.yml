# Publishes the static edition of Papermon to GitHub Pages on every push to main. The build uses relative
# addresses (vite.static.config.ts), so the site works at any address: /paper-girl/ now and /papermon/ after the rename.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run build:static
        env:
          # Papermon's card server on Astra's PC, reached through Tailscale Funnel (card server deck Q1).
          # While the PC or the server is off, the page works as before (docs/card-server-20261114.md).
          VITE_PAPERMON_SERVER: https://nv-1408202680.tail41447f.ts.net
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
