<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Girl card drafts</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Draft for Astra, 2026-11-13 (third round): back to the trading-card layout. No frame and nothing around the
   cards: each card is one clean rounded rectangle with everything inside it. Big picture window; moves and stats at
   the bottom instead of paragraphs. Common cards are plain; rarer cards get prismatic (holographic) backgrounds.
   One card per level, 1 to 5. Tap a card to flip it. Mirror Pool rules: one screen tall, 5x7 cards in cqw. */
:root{--bg:#1d1720;--ink:#f4e9ed;--soft:#b9a3b2;--pink:#efa9c5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif}
.row{flex:1;min-height:0;display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;overflow-y:hidden;padding:clamp(14px,3vh,28px) clamp(16px,3vw,32px);scroll-snap-type:x mandatory}
.slot{flex:0 0 auto;margin:auto 0;width:min(max(190px,calc((100vw - 64px - 140px)/6)),calc((100dvh - 150px)*5/7),440px);container-type:inline-size;display:flex;flex-direction:column;gap:8px;scroll-snap-align:center}
@media (max-width:620px){.slot{width:min(82vw,calc((100dvh - 120px)*5/7))}}
@media (max-height:460px){body{overflow:auto;height:auto}.row{flex:none}.slot{width:260px}}
.label{font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:1.4px;color:var(--soft);text-align:center}

/* flip */
.card{width:100%;aspect-ratio:5/7;perspective:1600px;cursor:pointer;border:0;padding:0;background:none;font:inherit;color:inherit;display:block}
.card:focus-visible{outline:2px solid var(--pink);outline-offset:4px;border-radius:3cqw}
.inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3cqw;overflow:hidden;box-shadow:0 2cqw 5cqw #0008;text-align:left;display:flex;flex-direction:column;padding:3.6cqw 4cqw;gap:2cqw;color:#2a1f2c}
.back{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}

/* Backgrounds by rarity. 1-2 plain; 3 soft prism; 4 holographic; 5 holographic with sparkle. */
.lv1 .face{background:#f2ece8}
.lv2 .face{background:linear-gradient(160deg,#eef3f7,#e3ecf3)}
.lv3 .face{background:linear-gradient(135deg,#fde8ef,#efe3fb 30%,#e1f3f6 55%,#fbf0d9 80%,#fde8ef)}
.lv4 .face,.lv5 .face{background:linear-gradient(125deg,#ffb3d6,#cfb0ff 16%,#9fdcff 32%,#b6ffd7 48%,#ffe99a 64%,#ffb3d6 80%,#cfb0ff);background-size:200% 200%;animation:prism 8s ease-in-out infinite alternate}
.lv4 .face::before,.lv5 .face::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff00 0 3cqw,#ffffff88 3cqw 3.8cqw,#ffffff00 3.8cqw 7cqw),linear-gradient(115deg,transparent 35%,#ffffffaa 48%,transparent 60%);background-size:auto,260% 100%;mix-blend-mode:overlay;pointer-events:none;animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%{background-position:0 0,130% 0}55%,100%{background-position:0 0,-70% 0}}
.lv3 .face::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,#ffffff88 48%,transparent 58%);background-size:260% 100%;mix-blend-mode:overlay;pointer-events:none;animation:sweep2 7s ease-in-out infinite}
@keyframes sweep2{0%{background-position:130% 0}55%,100%{background-position:-70% 0}}
.lv5 .face::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff 0.35cqw,transparent 0.5cqw),radial-gradient(#fff8 0.25cqw,transparent 0.4cqw);background-size:9cqw 11cqw,6cqw 7cqw;background-position:1cqw 2cqw,4cqw 5cqw;opacity:.7;pointer-events:none;animation:twinkle 3s ease-in-out infinite alternate}
@keyframes prism{from{background-position:0% 30%}to{background-position:100% 70%}}
@keyframes twinkle{from{opacity:.35}to{opacity:.8}}
@media (prefers-reduced-motion:reduce){.face,.face::before,.face::after{animation:none!important}}
.face>*{position:relative;z-index:1}
/* Author's Edition: a card its author revised. Rarest of all: gold foil and drifting gold sparkles over any level. */
.author .face{background:linear-gradient(135deg,#fff3cf,#f7d98a 25%,#fff7e0 45%,#f0c86a 65%,#fff3cf 85%);background-size:200% 200%;animation:prism 7s ease-in-out infinite alternate}
.author .face::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(#fff 0.4cqw,transparent 0.6cqw),radial-gradient(#ffe08a 0.5cqw,transparent 0.75cqw),radial-gradient(#fff 0.3cqw,transparent 0.45cqw);
  background-size:12cqw 14cqw,17cqw 19cqw,8cqw 9cqw;animation:drift 6s linear infinite}
@keyframes drift{from{background-position:0 0,3cqw 5cqw,6cqw 2cqw}to{background-position:0 -14cqw,3cqw -14cqw,6cqw -16cqw}}
.author .face::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,#ffffffcc 48%,transparent 58%);background-size:260% 100%;mix-blend-mode:overlay;pointer-events:none;animation:sweep2 4s ease-in-out infinite}
.seal{position:absolute;right:6cqw;top:16cqw;z-index:2;width:17cqw;height:17cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d6,#e3b047 60%,#b9862a);color:#4a3210;display:grid;place-items:center;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2.2cqw;line-height:1.1;letter-spacing:.15cqw;box-shadow:0 .8cqw 2cqw #5a3c0e55;transform:rotate(-12deg)}
.seal b{display:block;font-size:4.2cqw}
.toast{align-self:center;max-width:100%;font-size:12px;line-height:1.35;color:#2a1f2c;background:#ffe9a8;border-radius:12px;padding:8px 12px;box-shadow:0 4px 14px #0006}

/* Front */
.namebar{display:flex;align-items:center;gap:1.8cqw}
.stage{font-size:2.4cqw;font-weight:700;letter-spacing:.3cqw;padding:.6cqw 1.6cqw;border-radius:1cqw;background:#2a1f2c14;white-space:nowrap}
.name{flex:1;margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:5.8cqw;line-height:1;letter-spacing:-.2cqw}
.lv{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:3cqw;white-space:nowrap}
.lv b{font-size:5.8cqw}
.icon{flex:none;width:6.6cqw;height:6.6cqw;border-radius:50%;display:grid;place-items:center;background:#e98fb9;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:3.2cqw}
.window{flex:0 0 auto;height:56%;border-radius:1.6cqw;overflow:hidden;background:#d9c6d1;box-shadow:0 .5cqw 1.6cqw #2a1f2c33}
.window img{width:100%;height:100%;object-fit:cover;display:block}
.info{margin-top:-.6cqw;font-size:2.4cqw;font-style:italic;text-align:center;opacity:.75}
.moves{display:flex;flex-direction:column}
.move{display:grid;grid-template-columns:11cqw 1fr auto;align-items:center;gap:1.6cqw;padding:1.3cqw 0;border-top:.25cqw solid #2a1f2c1f}
.move:first-child{border-top:0}
.cost{display:flex;gap:.8cqw}
.cost i{width:3.8cqw;height:3.8cqw;border-radius:50%;background:#e98fb9;display:grid;place-items:center;font-style:normal;font-size:2.4cqw;color:#fff}
.cost i.y{background:#f0bf4c}
.move h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:4cqw;font-weight:700}
.move .dmg{font-family:'Space Grotesk',sans-serif;font-size:5cqw;font-weight:700}
.stats{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;border-top:.25cqw solid #2a1f2c1f;padding-top:1.4cqw}
.stats span{font-size:2.2cqw;opacity:.7;display:block}
.stats b{font-size:2.8cqw}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:2.2cqw;opacity:.75}
.foot .mark{font-size:3cqw;opacity:1}

/* Back */
.back{gap:3cqw;padding:7cqw 7cqw 5cqw;justify-content:space-between}
.back .sec h4{font-size:3.4cqw;letter-spacing:.35cqw;margin-bottom:1.2cqw}
.back .sec p.t{font-size:6.2cqw;line-height:1.25;font-weight:500;margin:0}
.back .foot{font-size:3.2cqw;opacity:.85}
.back .foot a{color:inherit;font-weight:700}
.back .kick{display:flex;justify-content:space-between;font-family:'Space Grotesk',sans-serif;font-size:2.5cqw;font-weight:700;letter-spacing:.35cqw;opacity:.75}
.back .title{margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:4.8cqw;line-height:1.12}
.back h4{margin:0;font-family:'Space Grotesk',sans-serif;font-size:2.4cqw;letter-spacing:.4cqw;color:#a24f78}
.back p.t{margin:.4cqw 0 0;font-size:3.1cqw;line-height:1.36}
.back .small{font-size:2.6cqw;line-height:1.35;opacity:.8}
.back .links{margin-top:auto;display:flex;gap:2cqw}
.back .links a{flex:1;text-align:center;font-size:2.8cqw;font-weight:600;color:inherit;background:#2a1f2c12;border-radius:9cqw;padding:2cqw 1cqw;text-decoration:none}
</style>
</head>
<body>
<main class="row" id="row"></main>
<script>
'use strict';
const P={name:'Pattern Listener',subject:'Psychology',initial:'Ψ',info:'Psychology · newborns · brain recordings (EEG)',
  headline:'A newborn’s brain is already listening for the pattern.',
  hook:'Babies only a few days old showed brain responses to repeating patterns in speech sounds and voices.',
  found:'Newborns heard carefully built sound streams while their brain activity was recorded. Their brains tracked repeating syllable patterns even when the voice changed, and voice patterns even when the syllables changed.',
  matters:'Learning language may start with a broad pattern detector we are born with.',
  small:'Brain responses to artificial sounds don’t show that newborns understand words.',
  // The back holds only these three, written short so they read at card size (Astra, 2026-11-13).
  shortHook:'Babies just days old already notice sound patterns.',
  shortFound:'Their brains tracked repeats in syllables and in voices, even when the other kept changing.',
  shortMatters:'We may be born with a pattern finder that helps us learn to talk.',
  journal:'eLife 2025',no:'000,128',set:'Brains & Babies',art:'../public/art/curious-brain-20261113.webp',alt:'A curious cartoon brain with a magnifying glass'};
const LEVELS=[null,{n:'Curious',r:'Common',m:'●',stage:'BASIC',read:'1 min'},{n:'Reader',r:'Uncommon',m:'◆',stage:'BASIC',read:'2 min'},
  {n:'College',r:'Rare',m:'★',stage:'STAGE 1',read:'3 min'},{n:'Grad',r:'Holo rare',m:'★',stage:'STAGE 1',read:'5 min'},{n:'PhD coffee',r:'Legendary',m:'✦',stage:'STAGE 2',read:'7 min'}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row=document.getElementById('row');
// Cards 1-5 are the five levels; card 6 is the same level-3 card after its author revised it.
for(let k=1;k<=6;k++){
  const author=k===6, lv=author?3:k;
  const L=author?{...LEVELS[3],r:"Author's Edition",m:'✍'}:LEVELS[lv];
  const slot=document.createElement('div');slot.className='slot '+(author?'author':'lv'+lv);
  slot.innerHTML=`${author?`<div class="toast">✨ Your card <b>${esc(P.name)}</b> was approved by its author.</div>`:''}<div class="label">${author?"AUTHOR'S EDITION · rarest":`LV ${lv} · ${L.r.toUpperCase()}`}</div>
  <button class="card" aria-pressed="false" aria-label="${esc(P.name)}, level ${lv}, ${L.r}. Tap to flip."><div class="inner">
   <div class="face front">
    <div class="namebar"><span class="stage">${L.stage}</span><p class="name">${esc(P.name)}</p><span class="lv">LV <b>${lv}</b></span><span class="icon" aria-hidden="true">${P.initial}</span></div>
    <div class="window"><img src="${P.art}" alt="${esc(P.alt)}"></div>${author?`<div class="seal" aria-label="Author's Edition"><span><b>✍</b>AUTHOR'S<br>EDITION</span></div>`:''}
    <div class="info">${esc(P.info)}</div>
    <div class="moves">
     <div class="move"><span class="cost"><i>Ψ</i></span><h3>Pattern Sense</h3><span class="dmg">${20+lv*10}</span></div>
     <div class="move"><span class="cost"><i>Ψ</i><i class="y">★</i></span><h3>Voice Tracker</h3><span class="dmg">${40+lv*20}</span></div>
    </div>
    <div class="stats"><div><span>weakness</span><b>small study</b></div><div><span>strength</span><b>careful test</b></div><div><span>read</span><b>${L.read}</b></div></div>
    <div class="foot"><span>${esc(P.journal)} · ${esc(P.set)}</span><span><span class="mark">${L.m}</span> ${P.no}</span></div>
   </div>
   <div class="face back">
    <div class="sec"><h4>STRANGE HOOK</h4><p class="t">${esc(P.shortHook)}</p></div>
    <div class="sec"><h4>WHAT THEY FOUND</h4><p class="t">${esc(P.shortFound)}</p></div>
    <div class="sec"><h4>WHY IT MATTERS</h4><p class="t">${esc(P.shortMatters)}</p></div>
    <div class="foot"><a href="#" onclick="event.stopPropagation()">Read the paper ↗</a><span>${author?'✍ ':''}No. ${P.no}</span></div>
   </div>
  </div></button>`;
  const card=slot.querySelector('.card');
  card.addEventListener('click',()=>{const on=card.classList.toggle('flipped');card.setAttribute('aria-pressed',String(on))});
  row.append(slot);
}
</script>
</body>
</html>
